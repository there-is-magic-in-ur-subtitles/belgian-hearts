*{box-sizing:border-box;-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-tap-highlight-color:transparent!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--canvas);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;touch-action:none;user-select:none}
.stage{width:100%;height:100%;display:grid;place-items:center}.app{position:relative;width:325px;height:568px;overflow:hidden;background:#fff;border-radius:0;box-shadow:0 18px 55px rgba(24,28,36,.18)}
header{height:58px;display:flex;align-items:center;justify-content:space-around;padding:0 10px;background:var(--paper);position:relative;z-index:5}
.icon-btn{appearance:none;border:0;background:transparent;padding:0;display:grid;place-items:center;color:#c3c8d0;position:relative;width:44px;height:44px}
.icon-btn svg{display:block}.icon-btn.on{color:var(--coral)}
.badge{position:absolute;top:1px;left:22px;background:linear-gradient(135deg,#e7b04c,#f4c86a);color:#fff;font-size:10px;font-weight:700;padding:2px 5px;border-radius:9px;line-height:1.1}
.dot{position:absolute;top:9px;right:7px;width:6px;height:6px;border-radius:50%;background:#ff5c5c}
main{height:510px;padding:0 6px 6px;display:grid;grid-template-rows:438px 66px;gap:0}.deck{position:relative;width:313px;height:438px}
.card{position:absolute;inset:0;border-radius:10px;overflow:hidden;background:#ccd0d4;box-shadow:0 2px 10px rgba(17,20,26,.18);transform-origin:50% 96%;will-change:transform;cursor:grab}.card.back{transform:scale(.975) translateY(4px);filter:saturate(.86)}.card.active{z-index:2}.card.dragging{transition:none!important;cursor:grabbing}.card.fly{transition:transform .32s cubic-bezier(.2,.72,.24,1),opacity .28s ease}
.portrait{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,rgba(0,0,0,.78))}
.progress{position:absolute;z-index:3;top:6px;left:8px;right:8px;height:4px;display:grid;gap:4px}.progress i{height:4px;border-radius:2px;background:rgba(0,0,0,.22)}.progress i.on{background:rgba(255,255,255,.95)}
.tap{position:absolute;z-index:2;pointer-events:none;top:0;bottom:110px;width:50%;border:0;background:transparent}.tap.left{left:0}.tap.right{right:0}
.info{position:absolute;z-index:3;left:14px;right:52px;bottom:14px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);pointer-events:none}
.title{display:flex;align-items:baseline;gap:8px}.title strong{font-size:30px;line-height:1;font-weight:800}.title span{font-size:23px;font-weight:400}
.line{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.line svg{flex:none;opacity:.9}
.info-btn{position:absolute;z-index:4;right:14px;bottom:44px;width:26px;height:26px;border-radius:50%;background:#fff;color:#222;border:0;font:800 15px/26px Georgia,serif;text-align:center;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.stamp{position:absolute;z-index:5;top:50px;padding:5px 8px;border:4px solid;border-radius:5px;font-size:28px;font-weight:900;letter-spacing:1px;opacity:0;transform:rotate(-13deg);pointer-events:none}.stamp.like{left:18px;color:var(--green)}.stamp.nope{right:18px;color:var(--coral);transform:rotate(13deg)}
.actions{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.action{appearance:none;border:0;background:var(--paper);border-radius:50%;display:grid;place-items:center;box-shadow:0 2px 9px rgba(38,42,50,.14);transition:transform .12s ease}.action:active{transform:scale(.88)}.action.small{width:42px;height:42px}.action.big{width:52px;height:52px}.action svg{display:block}
.undo{color:#f5b748}.nope{color:#fd5068}.star{color:#2db5f5}.yes{color:#26e3a8}.boost{color:#a952f2}
.empty-toast{position:absolute;left:50%;top:66px;z-index:10;transform:translate(-50%,-12px);opacity:0;background:var(--ink);color:#fff;padding:7px 11px;border-radius:18px;font-size:11px;transition:.2s}.empty-toast.show{opacity:1;transform:translate(-50%,0)}
.sheet{position:absolute;inset:auto 0 0 0;z-index:20;background:#fff;border-radius:14px 14px 0 0;padding:16px;transform:translateY(105%);transition:transform .25s;box-shadow:0 -6px 20px rgba(0,0,0,.18);font-size:14px;color:var(--ink)}.sheet.show{transform:none}.sheet h3{margin:0 0 6px;font-size:20px}.sheet p{margin:4px 0;color:#555}
@media(max-width:325px),(max-height:568px){.app{transform:scale(min(calc(100vw / 325),calc(100vh / 568)))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>

// Shuffle each pool, then evenly distribute new profiles across the whole deck.
function shufflePool(items){const result=[...items];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result}
function mixProfiles(existing,civilians){const originals=shufflePool(existing),newcomers=shufflePool(civilians),total=originals.length+newcomers.length;let a=0,b=0;return Array.from({length:total},(_,i)=>Math.floor((i+1)*newcomers.length/total)>Math.floor(i*newcomers.length/total)?newcomers[b++]:originals[a++])}
const profiles=mixProfiles(existingProfiles,civilianProfiles);

// Préchargement automatique de toutes les photos dans le cache
window.addEventListener('load', () => {
  profiles.forEach(p => {
    p.photos.forEach(url => {
      const img = new Image();
      img.src = url;
    });
  });
});

let index=0,photo=0,history=[],busy=false,startX=0,startY=0,dx=0,dragging=false,moved=false;
const sheet=document.getElementById('sheet'),deck=document.getElementById('deck'),toast=document.getElementById('toast');
function cardMarkup(p,isBack=false){const shown=isBack?0:photo;return `<article class="card ${isBack?'back':'active'}" aria-label="${p.name}, ${p.age}, ${p.location}"><img class="portrait" src="${p.photos[shown]}" alt="Portrait of ${p.name}" draggable="false"><div class="shade"></div><div class="progress" style="grid-template-columns:repeat(${p.photos.length},1fr)">${p.photos.map((_,i)=>`<i class="${i<=shown?'on':''}"></i>`).join('')}</div>${isBack?'':`<button class="tap left" aria-label="Previous photo"></button><button class="tap right" aria-label="Next photo"></button><div class="stamp like">LIKE</div><div class="stamp nope">NOPE</div><div class="info"><div class="title"><strong>${p.name}</strong><span>${p.age}</span></div><div class="line"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3"/></svg>${p.job}</div><div class="line"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 11 12 3l9 8v10H3z"/></svg>Vit ici : ${p.location}</div><div class="line"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 22s7-7 7-12a7 7 0 0 0-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>à ${p.km} kilomètre${p.km>1?"s":""}</div></div><button class="info-btn" id="infoBtn" aria-label="Profile info">i</button>`}</article>`}
function render(){const next=(index+1)%profiles.length;deck.innerHTML=cardMarkup(profiles[next],true)+cardMarkup(profiles[index]);bindCard()}
function setPhoto(next){photo=Math.max(0,Math.min(profiles[index].photos.length-1,next));render()}
function bindCard(){const card=deck.querySelector('.active');card.addEventListener('pointerdown',e=>{if(busy)return;dragging=true;moved=false;startX=e.clientX;startY=e.clientY;dx=0;card.setPointerCapture(e.pointerId);card.classList.add('dragging')});card.addEventListener('pointermove',e=>{if(!dragging)return;dx=e.clientX-startX;const dy=e.clientY-startY;if(Math.abs(dx)>5)moved=true;card.style.transform=`translate(${dx}px,${dy*.12}px) rotate(${dx/18}deg)`;const like=card.querySelector('.stamp.like'),nope=card.querySelector('.stamp.nope');like.style.opacity=Math.max(0,Math.min(1,dx/70));nope.style.opacity=Math.max(0,Math.min(1,-dx/70))});card.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;card.classList.remove('dragging');if(Math.abs(dx)>68)swipe(dx>0?1:-1);else if(!moved){const box=card.getBoundingClientRect();setPhoto(e.clientX<box.left+box.width/2?photo-1:photo+1)}else{card.classList.add('fly');card.style.transform='';setTimeout(()=>{card.classList.remove('fly');moved=false},320)}});card.addEventListener('pointercancel',()=>{dragging=false;card.style.transform=''})}
function swipe(dir,kind=''){if(busy)return;busy=true;const card=deck.querySelector('.active');history.push(index);if(history.length>30)history.shift();card.classList.add('fly');const y=kind==='star'?-620:18;card.style.transform=`translate(${dir*430}px,${y}px) rotate(${dir*24}deg)`;card.style.opacity='0';setTimeout(()=>{index=(index+1)%profiles.length;photo=0;busy=false;render();if(index===0){toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1100)}},300)}
function undo(){if(busy||!history.length)return;busy=true;const previous=history.pop();index=previous;photo=0;render();const card=deck.querySelector('.active');card.style.transform='translate(-370px,20px) rotate(-20deg)';card.style.opacity='0';requestAnimationFrame(()=>requestAnimationFrame(()=>{card.classList.add('fly');card.style.transform='';card.style.opacity='1'}));setTimeout(()=>{busy=false;card.classList.remove('fly')},330)}
document.getElementById('nope').onclick=()=>swipe(-1);document.getElementById('yes').onclick=()=>swipe(1);document.getElementById('star').onclick=()=>swipe(1,'star');document.getElementById('undo').onclick=undo;document.getElementById('boost').onclick=()=>{toast.textContent='Boost activé ⚡';toast.classList.add('show');setTimeout(()=>{toast.classList.remove('show');toast.textContent='Back to the start'},1100)};deck.addEventListener('pointerdown',e=>{if(e.target.closest('.info-btn'))e.stopPropagation()},true);deck.addEventListener('click',e=>{if(e.target.closest('.info-btn')){const p=profiles[index];sheet.innerHTML=`<h3>${p.name}, ${p.age}</h3><p>${p.bio}</p><p>${p.job} · ${p.location}, Bruxelles</p><p>à ${p.km} km</p>`;sheet.classList.add('show')}});document.getElementById('sheet').onclick=()=>sheet.classList.remove('show');document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')swipe(-1);if(e.key==='ArrowRight')swipe(1);if(e.key==='ArrowUp')swipe(1,'star')});render();
</script>
