-weight:900;letter-spacing:1px;opacity:0;transform:rotate(-13deg);pointer-events:none}.stamp.like{left:18px;color:var(--green)}.stamp.nope{right:18px;color:var(--coral);transform:rotate(13deg)}.actions{height:66px;display:flex;align-items:center;justify-content:center;gap:15px}.action{appearance:none;border:0;background:var(--paper);border-radius:50%;display:grid;place-items:center;box-shadow:0 2px 10px rgba(38,42,50,.18);transition:transform .12s ease}.action:active{transform:scale(.88)}.action.small{width:44px;height:44px}.action.big{width:52px;height:52px}.action svg{display:block}.undo{color:var(--gold)}.nope{color:var(--coral)}.star{color:var(--blue)}.yes{color:var(--green)}.counter{position:absolute;right:11px;bottom:82px;z-index:5;color:#fff;font-size:10px;font-weight:700;text-shadow:0 1px 2px #000}.empty-toast{position:absolute;left:50%;top:66px;z-index:10;transform:translate(-50%,-12px);opacity:0;background:var(--ink);color:#fff;padding:7px 11px;border-radius:18px;font-size:11px;transition:.2s}.empty-toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:325px),(max-height:568px){.app{transform:scale(min(calc(100vw / 325),calc(100vh / 568)))}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}

function cardMarkup(p,isBack=false){const shown=isBack?0:photo;return `<article class="card ${isBack?'back':'active'}" aria-label="${p.name}, ${p.age}, ${p.location}"><img class="portrait" src="${p.photos[shown]}" alt="Portrait of ${p.name}" draggable="false"><div class="shade"></div><div class="progress" style="grid-template-columns:repeat(${p.photos.length},1fr)">${p.photos.map((_,i)=>`<i class="${i<=shown?'on':''}"></i>`).join('')}</div>${isBack?'':`<button class="tap left" aria-label="Previous photo"></button><button class="tap right" aria-label="Next photo"></button><div class="stamp like">LIKE</div><div class="stamp nope">NOPE</div><div class="info"><div class="title"><strong>${p.name}</strong><span>${p.age}</span><b class="verified">✓</b></div><div class="location">${p.location}, Belgium</div><div class="bio">${p.bio}</div></div><small class="counter">${index+1} / ${profiles.length}</small>`}</article>`}
function render(){const next=(index+1)%profiles.length;deck.innerHTML=cardMarkup(profiles[next],true)+cardMarkup(profiles[index]);bindCard()}
function setPhoto(next){photo=Math.max(0,Math.min(profiles[index].photos.length-1,next));render()}
function bindCard(){const card=deck.querySelector('.active');card.addEventListener('pointerdown',e=>{if(busy)return;dragging=true;moved=false;startX=e.clientX;startY=e.clientY;dx=0;card.setPointerCapture(e.pointerId);card.classList.add('dragging')});card.addEventListener('pointermove',e=>{if(!dragging)return;dx=e.clientX-startX;const dy=e.clientY-startY;if(Math.abs(dx)>5)moved=true;card.style.transform=`translate(${dx}px,${dy*.12}px) rotate(${dx/18}deg)`;const like=card.querySelector('.stamp.like'),nope=card.querySelector('.stamp.nope');like.style.opacity=Math.max(0,Math.min(1,dx/70));nope.style.opacity=Math.max(0,Math.min(1,-dx/70))});card.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;card.classList.remove('dragging');if(Math.abs(dx)>68)swipe(dx>0?1:-1);else if(!moved){const box=card.getBoundingClientRect();setPhoto(e.clientX<box.left+box.width/2?photo-1:photo+1)}else{card.classList.add('fly');card.style.transform='';setTimeout(()=>{card.classList.remove('fly');moved=false},320)}});card.addEventListener('pointercancel',()=>{dragging=false;card.style.transform=''})}
function swipe(dir,kind=''){if(busy)return;busy=true;const card=deck.querySelector('.active');history.push(index);if(history.length>30)history.shift();card.classList.add('fly');const y=kind==='star'?-620:18;card.style.transform=`translate(${dir*430}px,${y}px) rotate(${dir*24}deg)`;card.style.opacity='0';setTimeout(()=>{index=(index+1)%profiles.length;photo=0;busy=false;render();if(index===0){toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1100)}},300)}
function undo(){if(busy||!history.length)return;busy=true;const previous=history.pop();index=previous;photo=0;render();const card=deck.querySelector('.active');card.style.transform='translate(-370px,20px) rotate(-20deg)';card.style.opacity='0';requestAnimationFrame(()=>requestAnimationFrame(()=>{card.classList.add('fly');card.style.transform='';card.style.opacity='1'}));setTimeout(()=>{busy=false;card.classList.remove('fly')},330)}
document.getElementById('nope').onclick=()=>swipe(-1);document.getElementById('yes').onclick=()=>swipe(1);document.getElementById('star').onclick=()=>swipe(1,'star');document.getElementById('undo').onclick=undo;document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')swipe(-1);if(e.key==='ArrowRight')swipe(1);if(e.key==='ArrowUp')swipe(1,'star')});render();
</script></body></html>
